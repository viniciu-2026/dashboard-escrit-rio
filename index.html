<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Dashboard Processual — Viniciu Gonçalves</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230a0a0a' rx='8'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-size='36' font-weight='700' fill='%23c9a84c' text-anchor='middle'%3EVG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root {
  --bg:#0a0a0a; --surface:#111111; --surface2:#181818; --surface3:#1e1e1e;
  --border:#242424; --border2:#1c1c1c;
  --gold:#c9a84c; --gold-lt:#e0c068; --gold-dk:#9a7830;
  --gold-sub:rgba(201,168,76,0.10); --gold-sub2:rgba(201,168,76,0.05);
  --text:#eeeeee; --text2:#8a8a8a; --text3:#484848;
  --urgent:#e05252; --urgent-bg:rgba(224,82,82,0.10);
  --ok:#52b788; --ok-bg:rgba(82,183,136,0.10);
  --blue:#5b9cf6; --blue-bg:rgba(91,156,246,0.10);
  --warn:#e67e22; --warn-bg:rgba(230,126,34,0.10);
  --purple:#a78bfa; --purple-bg:rgba(167,139,250,0.10);
  --r:10px; --r-sm:6px; --r-lg:14px;
  --shadow:0 8px 32px rgba(0,0,0,0.55); --shadow-sm:0 2px 10px rgba(0,0,0,0.35);
  --transition:0.18s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}

/* === HEADER === */
.header{background:linear-gradient(180deg,#141414 0%,#0f0f0f 100%);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:76px;position:sticky;top:0;z-index:100;box-shadow:0 1px 0 rgba(255,255,255,0.03)}
.header-logo{display:flex;align-items:center;gap:16px}
.logo-mark{width:52px;height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.header-title{font-size:17px;font-weight:700;color:var(--text);letter-spacing:0.02em}
.header-sub{font-size:10px;color:var(--gold);margin-top:2px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase}
.header-right{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:10px}
.header-count-badge{background:var(--gold-sub);color:var(--gold);border:1px solid rgba(201,168,76,0.22);font-size:12px;font-weight:600;padding:4px 14px;border-radius:20px;letter-spacing:0.02em}

/* === SYNC BADGE === */
.sync-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:500;letter-spacing:0.02em;padding:3px 10px;border-radius:20px;transition:all 0.3s ease;white-space:nowrap}
.sync-dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
.sync-ok{background:rgba(82,183,136,0.08);color:#52b788;border:1px solid rgba(82,183,136,0.2)}.sync-ok .sync-dot{background:#52b788}
.sync-syncing{background:var(--gold-sub);color:var(--gold);border:1px solid rgba(201,168,76,0.2)}.sync-syncing .sync-dot{background:var(--gold);animation:syncpulse 1s ease infinite}
.sync-error{background:var(--urgent-bg);color:var(--urgent);border:1px solid rgba(224,82,82,0.2)}.sync-error .sync-dot{background:var(--urgent)}
.sync-offline{background:var(--surface2);color:var(--text3);border:1px solid var(--border)}.sync-offline .sync-dot{background:var(--text3)}
@keyframes syncpulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* === CONTAINER === */
.container{max-width:1520px;margin:0 auto;padding:1.5rem 2rem}

/* === STATS === */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin-bottom:1.25rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:.9rem 1.2rem;transition:border-color var(--transition),transform var(--transition),box-shadow var(--transition);position:relative;overflow:hidden;cursor:pointer}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--border);transition:background var(--transition)}
.stat:hover{border-color:rgba(201,168,76,0.2);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.stat-n{font-size:26px;font-weight:700;line-height:1.1;color:var(--text)}
.stat-l{font-size:10px;color:var(--text2);margin-top:5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase}
.n-urg{color:#f07070}.stat:has(.n-urg)::before{background:#f07070}
.n-aij{color:var(--gold)}.stat:has(.n-aij)::before{background:var(--gold)}
.n-ok{color:var(--ok)}.stat:has(.n-ok)::before{background:var(--ok)}
.n-atencao{color:#d4894a}.stat:has(.n-atencao)::before{background:#d4894a}

/* === TOOLBAR === */
.toolbar{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:.8rem 1.2rem;margin-bottom:1rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.filter-btn{font-size:11.5px;font-weight:600;padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all var(--transition);letter-spacing:0.02em;white-space:nowrap}
.filter-btn:hover{border-color:var(--text3);color:var(--text)}
.filter-btn.active{background:var(--gold-sub);color:var(--gold);border-color:rgba(201,168,76,0.35)}
.search{position:relative}
.search input{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:13px;padding:7px 14px 7px 32px;border-radius:var(--r-sm);outline:none;width:270px;font-family:inherit;transition:border-color var(--transition)}
.search input:focus{border-color:var(--gold-dk)}
.search input::placeholder{color:var(--text3)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}
.btn-icon{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:7px 12px;border-radius:var(--r-sm);cursor:pointer;font-size:12px;font-weight:500;transition:all var(--transition)}
.btn-icon:hover{border-color:var(--border2);color:var(--text);background:var(--surface3)}

/* === TABLE === */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead tr{background:#131313;border-bottom:1px solid var(--border)}
th{padding:10px 13px;text-align:left;font-size:10px;font-weight:700;color:var(--text3);letter-spacing:0.1em;text-transform:uppercase;white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border2);transition:background var(--transition)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,0.014)}
tbody tr.row-urgente{border-left:2px solid #e05252}
tbody tr.row-aij{border-left:2px solid var(--gold)}
tbody tr.row-atencao{border-left:2px solid #e67e22}
td{padding:11px 13px;vertical-align:top}

/* === STATUS BADGES === */
.st-badges{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-start}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;letter-spacing:0.03em}
.badge-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.b-urgente{background:rgba(224,82,82,0.12);color:#f07070;border:1px solid rgba(224,82,82,0.22)}.b-urgente .badge-dot{background:#f07070}
.b-aij{background:rgba(201,168,76,0.12);color:var(--gold-lt);border:1px solid rgba(201,168,76,0.28)}.b-aij .badge-dot{background:var(--gold)}
.b-atencao{background:rgba(230,126,34,0.12);color:#d4894a;border:1px solid rgba(230,126,34,0.22)}.b-atencao .badge-dot{background:#d4894a}
.b-aguardando{background:var(--surface3);color:var(--text2);border:1px solid var(--border)}.b-aguardando .badge-dot{background:var(--text3)}
.b-encerrado{background:rgba(82,183,136,0.10);color:#62c795;border:1px solid rgba(82,183,136,0.22)}.b-encerrado .badge-dot{background:#62c795}
.b-favoravel{background:rgba(82,183,136,0.10);color:#52b788;border:1px solid rgba(82,183,136,0.22)}.b-favoravel .badge-dot{background:#52b788}

/* === STATUS PICKER === */
.st-wrap{position:relative;display:inline-block}
.st-pick-btn{background:none;border:1px dashed rgba(201,168,76,0.3);color:var(--text3);width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:11px;display:inline-flex;align-items:center;justify-content:center;transition:all var(--transition);line-height:1;padding:0;vertical-align:middle;margin-left:3px}
.st-pick-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-sub)}
.st-picker{display:none;position:absolute;top:calc(100% + 5px);left:0;z-index:600;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;min-width:195px}
.st-picker.open{display:block;animation:fadeIn .14s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.st-picker-title{font-size:9.5px;font-weight:700;color:var(--text3);letter-spacing:0.1em;text-transform:uppercase;padding:4px 10px 7px;margin-bottom:2px;border-bottom:1px solid var(--border2)}
.st-opt{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:12.5px;font-weight:600;transition:background var(--transition);white-space:nowrap;color:var(--text)}
.st-opt:hover{background:var(--surface3)}
.st-check{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;transition:all var(--transition)}
.st-opt.checked .st-check{background:var(--gold);border-color:var(--gold);color:#000}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.st-sep{border:none;border-top:1px solid var(--border);margin:4px 0}
.st-restore{font-size:11px;color:var(--text2);padding:6px 10px;cursor:pointer;border-radius:var(--r-sm);transition:all var(--transition)}
.st-restore:hover{background:var(--surface3);color:var(--urgent)}
.st-manual-dot{display:inline-block;width:5px;height:5px;background:var(--gold);border-radius:50%;margin-left:3px;vertical-align:middle;opacity:0.7}

/* === TIPO & SISTEMA === */
.tipo-c{color:#6aacf0;font-size:10px;font-weight:700;background:rgba(91,156,246,0.12);padding:2px 7px;border-radius:4px;letter-spacing:0.03em}
.tipo-cv{color:#62c795;font-size:10px;font-weight:700;background:rgba(82,183,136,0.12);padding:2px 7px;border-radius:4px;letter-spacing:0.03em}
.sys-badge{display:block;margin-top:4px;font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap;letter-spacing:0.02em}
.sys-tjrj{background:var(--purple-bg);color:var(--purple)}
.sys-jf{background:var(--gold-sub);color:var(--gold)}
.sys-tjro{background:var(--urgent-bg);color:#f07070}
.sys-tjsp{background:var(--ok-bg);color:#62c795}
.sys-pdpj{background:var(--blue-bg);color:var(--blue)}
.sys-proj{background:var(--warn-bg);color:#d4894a}
.sys-del{background:var(--surface3);color:var(--text2)}
.sys-eleit{background:rgba(236,72,153,0.10);color:#f472b6}

/* === EDITABLE CELLS === */
.editable-cell{cursor:pointer;border-radius:var(--r-sm);transition:background var(--transition);position:relative}
.editable-cell:hover{background:rgba(201,168,76,0.04)}
.edit-hint{font-size:9px;color:var(--gold-dk);opacity:0;transition:opacity var(--transition);margin-left:4px;vertical-align:middle}
.editable-cell:hover .edit-hint{opacity:0.7}
.override-dot{display:inline-block;width:5px;height:5px;background:var(--gold);border-radius:50%;margin-left:4px;vertical-align:middle;opacity:0.8}
.edit-box{width:100%;min-height:64px;font-size:12.5px;font-family:inherit;border:1.5px solid var(--gold-dk);border-radius:var(--r-sm);padding:7px 10px;resize:vertical;line-height:1.6;color:var(--text);outline:none;background:var(--surface2)}
.edit-box-inline{width:100%;font-size:13px;font-family:inherit;border:1.5px solid var(--gold-dk);border-radius:var(--r-sm);padding:5px 9px;line-height:1.5;color:var(--text);outline:none;background:var(--surface2)}
.edit-actions{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.edit-save{font-size:11px;padding:4px 12px;background:var(--gold);color:#0a0a0a;border:none;border-radius:var(--r-sm);cursor:pointer;font-weight:700;transition:opacity var(--transition)}
.edit-save:hover{opacity:0.85}
.edit-cancel{font-size:11px;padding:4px 11px;background:var(--surface3);color:var(--text2);border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;transition:all var(--transition)}
.edit-cancel:hover{color:var(--text)}
.edit-clear{font-size:11px;padding:4px 11px;background:transparent;color:var(--urgent);border:1px solid rgba(224,82,82,0.25);border-radius:var(--r-sm);cursor:pointer;transition:all var(--transition)}
.edit-clear:hover{background:var(--urgent-bg)}

/* === TEXT CELLS === */
.proc-num{font-size:11.5px;color:var(--text2);font-family:'SF Mono','Consolas',monospace;line-height:1.7;word-break:break-all}
.res-urg{color:#f07070;font-size:13px;line-height:1.6}
.res-norm{color:var(--text);font-size:13px;line-height:1.6}
.prox-text{font-size:13px;color:var(--text2);line-height:1.6}
.ver-text{font-size:11.5px;color:var(--text3);white-space:nowrap}
.empty{padding:4rem;text-align:center;color:var(--text3);font-size:14px}
.count-info{font-size:11.5px;color:var(--text3);padding:.7rem 1.2rem;border-top:1px solid var(--border2);background:var(--surface2);letter-spacing:0.03em}

@media(max-width:900px){
  .container{padding:1rem}.header{padding:0 1rem;height:64px}
  .search input{width:200px}.stats{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
}
@media print{.toolbar,.header-right,.st-pick-btn,.edit-hint{display:none}.header{position:static}}
</style>
</head>

</div>

};

// ================================================================
// UTILITÁRIOS
// ================================================================
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return esc(s).replace(/"/g,'&quot;'); }
function lsGet(k,d) { try { const v=localStorage.getItem(k); return v?JSON.parse(v):d; } catch(e){ return d; } }
function lsSet(k,v) { try { localStorage.setItem(k,JSON.stringify(v)); } catch(e){} }

// ================================================================
// FIREBASE
// ================================================================
const FIREBASE_PATH = 'dashboard';
let sharedData = { statusOverrides:{}, fieldOverrides:{} };
let _fbEnabled=false, _fbRef=null, _saveTimer=null, _localWrite=false;

function setSyncStatus(state) {
  const el = document.getElementById('sync-badge');
  if (!el) return;
  const labels={ok:'Sincronizado',syncing:'Salvando…',error:'Sem conexão',offline:'Modo local',connecting:'Conectando…'};
  el.className='sync-badge sync-'+(state==='connecting'?'syncing':state);
  el.innerHTML=`<span class="sync-dot"></span>${labels[state]||state}`;
}

function _fbConfigured() { return FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey!=='COLE_AQUI'; }

function initSync() {
  if (!_fbConfigured()) {
    sharedData.statusOverrides = lsGet('status_overrides',{});
    sharedData.fieldOverrides  = lsGet('field_overrides',{});
    setSyncStatus('offline');
    renderAll();
    return;
  }
  setSyncStatus('connecting');
  try {
    const app = firebase.initializeApp(FIREBASE_CONFIG);
    _fbRef = firebase.database(app).ref(FIREBASE_PATH);
    _fbEnabled = true;
    _fbRef.on('value', snap => {
      if (_localWrite) { _localWrite=false; return; }
      const rec = snap.val() || {};
      sharedData.statusOverrides = rec.statusOverrides || {};
      sharedData.fieldOverrides  = rec.fieldOverrides  || {};
      setSyncStatus('ok');
      renderAll();
    });
    _fbRef.on('error', ()=>setSyncStatus('error'));
  } catch(e) {
    sharedData.statusOverrides = lsGet('status_overrides',{});
    sharedData.fieldOverrides  = lsGet('field_overrides',{});
    setSyncStatus('error');
    renderAll();
  }
}

function scheduleSave() {
  lsSet('status_overrides', sharedData.statusOverrides);
  lsSet('field_overrides',  sharedData.fieldOverrides);
  if (!_fbEnabled) return;
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(()=>{
    setSyncStatus('syncing');
    _localWrite = true;
    _fbRef.set(sharedData, err => setSyncStatus(err?'error':'ok'));
  }, 600);
}

// ================================================================
// SISTEMA DE STATUS — MULTI-STATUS
// ================================================================
const ST_PICKER_OPTS = [
  {key:'urgente',   label:'Urgente',     color:'#f07070'},
  {key:'aij',       label:'AIJ marcada', color:'#c9a84c'},
  {key:'atencao',   label:'Atenção',     color:'#d4894a'},
  {key:'aguardando',label:'Aguardando',  color:'#666'},
  {key:'encerrado', label:'Encerrado',   color:'#62c795'},
  {key:'favoravel', label:'Favorável',   color:'#52b788'},
];

const ST_LABELS = {
  urgente:'Urgente', aij:'AIJ marcada', atencao:'Atenção',
  aguardando:'Aguardando', encerrado:'Encerrado', favoravel:'Favorável'
};

function bc(st) {
  return ({urgente:'b-urgente',aij:'b-aij',atencao:'b-atencao',
           aguardando:'b-aguardando',encerrado:'b-encerrado',favoravel:'b-favoravel'})[st]||'b-aguardando';
}

// Normaliza para array (retrocompatibilidade com deolho → atencao)
function _normSt(v) {
  if (!v) return null;
  if (Array.isArray(v)) return v.length>0 ? v.map(s=>s==='deolho'?'atencao':s) : null;
  const mapped = v==='deolho'?'atencao':v;
  return [mapped];
}

function getStOv(id)      { return _normSt(sharedData.statusOverrides[id]); }
function setStOv(id, arr) { sharedData.statusOverrides[id]=arr; scheduleSave(); }
function delStOv(id)      { delete sharedData.statusOverrides[id]; scheduleSave(); }

function toggleStStatus(id, val) {
  let arr = getStOv(id) || [];
  const idx = arr.indexOf(val);
  if (idx>=0) arr.splice(idx,1); else arr.push(val);
  if (arr.length===0) delStOv(id); else setStOv(id,arr);
}

function effStArr(d) {
  const ov = getStOv(d.id);
  if (ov && ov.length>0) return ov;
  const st = (d.st==='deolho')?'atencao':d.st;
  return [st];
}
function effSt(d)  { return effStArr(d)[0]; }
function effStL(d) { return effStArr(d).map(s=>ST_LABELS[s]||s).join(', '); }

// Campo overrides
function getOv(id,f)   { return (sharedData.fieldOverrides[id+'_'+f]??null); }
function setOv(id,f,v) { sharedData.fieldOverrides[id+'_'+f]=v; scheduleSave(); }
function delOv(id,f)   { delete sharedData.fieldOverrides[id+'_'+f]; scheduleSave(); }
function getField(d,f) { const ov=getOv(d.id,f); return ov!==null?ov:(d[f]??''); }

// ================================================================
// DETECÇÃO DE SISTEMA PROCESSUAL
// ================================================================
function detectSys(proc,res) {
  const p=(proc||'').toLowerCase(), r=(res||'').toLowerCase();
  if (p.includes('4.02.')) return {cls:'sys-jf',label:'JF / TRF2'};
  if (p.includes('8.22.')) return {cls:'sys-tjro',label:'PJe TJRO'};
  if (p.includes('8.26.')) return {cls:'sys-tjsp',label:'TJSP'};
  if (p.includes('eleit')||r.includes('eleit')||r.includes('tre')) return {cls:'sys-eleit',label:'Justiça Eleitoral'};
  if (p.includes('8.19.')) {
    if (r.includes('projudi')) return {cls:'sys-proj',label:'PROJUDI'};
    if (r.includes('pdpj'))    return {cls:'sys-pdpj',label:'PDPJ'};
    return {cls:'sys-tjrj',label:'PJe TJRJ'};
  }
  if (/\b(118|956|912|129|131|132)\s*[-–]\s*\d/.test(p)||r.includes('delegacia')||p.includes('inquérito')||p.includes('inquerito')) return {cls:'sys-del',label:'Delegacia'};
  return null;
}
function sysBadge(proc,res) {
  const s=detectSys(proc,res);
  return s?`<span class="sys-badge ${s.cls}">${s.label}</span>`:'';
}

// ================================================================
// AUTO-CLASSIFICAÇÃO DE STATUS (usado na atualização de processos)
// ================================================================
function autoClassifyStatus(res, prox) {
  const text = ((res||'')+(prox||'')).toLowerCase();
  const statuses = [];
  // AIJ marcada — detecta data de audiência
  if (/\baij\b|audiência de instrução|audiência.*instrução|instrução.*julgamento/i.test(res||'')) statuses.push('aij');
  // Urgente
  if (/⚠️|urgente|urgência|prazo.*vence|vence.*hoje|prazo.*hoje|sentença.*publicada|acórdão/i.test(res||'')) statuses.push('urgente');
  // Encerrado
  if (/arquivado definitivamente|baixa definitiva|encerrado|transitado em julgado/i.test(res||'')) statuses.push('encerrado');
  // Favoravel
  if (/procedente|favorável|acordo homologado|sentença.*procedente/i.test(res||'')) statuses.push('favoravel');
  // Atenção
  if (/decorrido.*prazo|prazo decorrido|pendente.*manifestação|aguardando.*urgente/i.test(text)) statuses.push('atencao');
  return statuses.length > 0 ? statuses : ['aguardando'];
}

// ================================================================
// FILTROS E BUSCA
// ================================================================
let activeFilter='todos', searchTerm='', sortByVer=false, sortVerAsc=false;

const filterDefs = [
  {key:'todos',      label:'Todos'},
  {key:'urgente',    label:'🔴 Urgentes'},
  {key:'aij',        label:'⚖️ AIJ marcada'},
  {key:'atencao',    label:'🟠 Atenção'},
  {key:'aguardando', label:'Aguardando'},
  {key:'encerrado',  label:'✅ Encerrados'},
  {key:'Criminal',   label:'Criminais'},
  {key:'Cível',      label:'Cíveis'},
  {key:'recent7',    label:'📅 Últ. 7 dias'},
];

function parseVerDate(ver) {
  if (!ver||ver==='—') return null;
  const p=ver.split('/');
  if (p.length!==3) return null;
  return new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));
}

function renderFilters() {
  document.getElementById('filters').innerHTML = filterDefs.map(f=>
    `<button class="filter-btn${activeFilter===f.key?' active':''}" onclick="setFilter('${f.key}')">${f.label}</button>`
  ).join('');
}

function setFilter(k) { activeFilter=k; renderFilters(); renderTable(); }

function filtered() {
  return data.filter(d => {
    const stArr=effStArr(d);
    let mf;
    if      (activeFilter==='todos')     mf=true;
    else if (activeFilter==='Criminal')  mf=d.tipo==='Criminal';
    else if (activeFilter==='Cível')     mf=d.tipo==='Cível';
    else if (activeFilter==='encerrado') mf=stArr.includes('encerrado')||stArr.includes('favoravel');
    else if (activeFilter==='recent7') {
      const dt=parseVerDate(getField(d,'ver'));
      if (!dt) { mf=false; }
      else { const c=new Date(); c.setHours(0,0,0,0); c.setDate(c.getDate()-7); mf=dt>=c; }
    } else mf=stArr.includes(activeFilter);
    const s=searchTerm.toLowerCase();
    const ms=!s||getField(d,'cl').toLowerCase().includes(s)||getField(d,'proc').toLowerCase().includes(s)||getField(d,'res').toLowerCase().includes(s);
    return mf&&ms;
  });
}

// ================================================================
// STATS
// ================================================================
function renderStats() {
  const ativos  = data.filter(d=>!effStArr(d).includes('encerrado')&&!effStArr(d).includes('favoravel')).length;
  const urg     = data.filter(d=>effStArr(d).includes('urgente')).length;
  const aij     = data.filter(d=>effStArr(d).includes('aij')).length;
  const enc     = data.filter(d=>effStArr(d).includes('encerrado')||effStArr(d).includes('favoravel')).length;
  const atencao = data.filter(d=>effStArr(d).includes('atencao')).length;
  const crim    = data.filter(d=>d.tipo==='Criminal').length;
  const civ     = data.filter(d=>d.tipo==='Cível').length;
  document.getElementById('stats').innerHTML =
    `<div class="stat" onclick="setFilter('todos')"><div class="stat-n">${ativos}</div><div class="stat-l">Ativos</div></div>`+
    `<div class="stat" onclick="setFilter('urgente')"><div class="stat-n n-urg">${urg}</div><div class="stat-l">Urgentes</div></div>`+
    `<div class="stat" onclick="setFilter('aij')"><div class="stat-n n-aij">${aij}</div><div class="stat-l">AIJ marcada</div></div>`+
    `<div class="stat" onclick="setFilter('atencao')"><div class="stat-n n-atencao">${atencao}</div><div class="stat-l">Atenção</div></div>`+
    `<div class="stat" onclick="setFilter('encerrado')"><div class="stat-n n-ok">${enc}</div><div class="stat-l">Encerrados</div></div>`+
    `<div class="stat" onclick="setFilter('Criminal')"><div class="stat-n">${crim}</div><div class="stat-l">Criminais</div></div>`+
    `<div class="stat" onclick="setFilter('Cível')"><div class="stat-n">${civ}</div><div class="stat-l">Cíveis</div></div>`;
  document.getElementById('hdr-count').textContent = data.length+' processos';
}

// ================================================================
// TABELA — RENDERIZAÇÃO
// ================================================================
function toggleSortVer() {
  if (!sortByVer) { sortByVer=true; sortVerAsc=true; }
  else if (sortVerAsc) { sortVerAsc=false; }
  else { sortByVer=false; }
  renderTable();
}

function rowClass(d) {
  const arr=effStArr(d);
  if (arr.includes('urgente')) return 'row-urgente';
  if (arr.includes('aij'))     return 'row-aij';
  if (arr.includes('atencao')) return 'row-atencao';
  return '';
}

function buildStatusCell(d) {
  const arr = effStArr(d);
  const isManual = getStOv(d.id)!==null;
  const badges = arr.map(s=>`<span class="badge ${bc(s)}"><span class="badge-dot"></span>${esc(ST_LABELS[s]||s)}</span>`).join('');
  const manualDot = isManual?'<span class="st-manual-dot" title="Definido manualmente"></span>':'';
  const pickerOpts = ST_PICKER_OPTS.map(o=>{
    const chk=arr.includes(o.key);
    return `<div class="st-opt${chk?' checked':''}" onclick="applyMultiSt(event,${d.id},'${o.key}')"><span class="st-check">${chk?'✓':''}</span><span class="dot" style="background:${o.color}"></span>${o.label}</div>`;
  }).join('');
  return `<div class="st-wrap">
    <div class="st-badges">${badges}${manualDot}<button class="st-pick-btn" onclick="toggleStPicker(event,${d.id})" title="Alterar status">✎</button></div>
    <div class="st-picker" id="stp-${d.id}">
      <div class="st-picker-title">Selecionar status</div>
      ${pickerOpts}
      <hr class="st-sep">
      <div class="st-restore" onclick="restoreStatus(${d.id})">↩ Restaurar original</div>
    </div>
  </div>`;
}

function renderTable() {
  let rows = filtered();
  if (sortByVer) {
    rows = rows.slice().sort((a,b)=>{
      const da=parseVerDate(getField(a,'ver')), db=parseVerDate(getField(b,'ver'));
      const ta=da?da.getTime():(sortVerAsc?Infinity:-Infinity);
      const tb=db?db.getTime():(sortVerAsc?Infinity:-Infinity);
      return sortVerAsc?ta-tb:tb-ta;
    });
  }
  const icon=!sortByVer?'↕':sortVerAsc?'↑':'↓';
  const si=document.getElementById('sort-icon');
  if (si) si.textContent=icon;

  const tbody=document.getElementById('tbody');
  const empty=document.getElementById('empty');
  const info=document.getElementById('count-info');
  if (!rows.length) { tbody.innerHTML=''; empty.style.display='block'; info.textContent=''; return; }
  empty.style.display='none';
  info.textContent=rows.length+' processo'+(rows.length!==1?'s':'')+' encontrado'+(rows.length!==1?'s':'');

  tbody.innerHTML = rows.map(d => {
    const rc=rowClass(d);
    const resOv=getOv(d.id,'res'), proxOv=getOv(d.id,'prox');
    const clOv=getOv(d.id,'cl'),   procOv=getOv(d.id,'proc'), verOv=getOv(d.id,'ver');
    const resText  = resOv!==null  ? resOv  : d.res;
    const proxText = proxOv!==null ? proxOv : d.prox;
    const clText   = clOv!==null   ? clOv   : d.cl;
    const procText = procOv!==null ? procOv : d.proc;
    const verText  = verOv!==null  ? verOv  : d.ver;
    const resCls   = effStArr(d).includes('urgente')?'res-urg':'res-norm';
    const dRes=resOv!==null?'<span class="override-dot" title="Editado"></span>':'';
    const dProx=proxOv!==null?'<span class="override-dot" title="Editado"></span>':'';
    const dCl=clOv!==null?'<span class="override-dot" title="Editado"></span>':'';
    const dProc=procOv!==null?'<span class="override-dot" title="Editado"></span>':'';
    const dVer=verOv!==null?'<span class="override-dot" title="Editado"></span>':'';
    return `<tr class="${rc}">
      <td class="editable-cell" id="cell-${d.id}-cl" onclick="startEdit(${d.id},'cl',this,'inline')"><strong>${esc(clText)}</strong>${dCl}<span class="edit-hint">✎</span></td>
      <td class="editable-cell" id="cell-${d.id}-proc" onclick="startEdit(${d.id},'proc',this,'inline')"><span class="proc-num">${esc(procText)}</span>${dProc}<span class="edit-hint">✎</span></td>
      <td><span class="${d.tipo==='Criminal'?'tipo-c':'tipo-cv'}">${esc(getField(d,'tipo'))}</span>${sysBadge(procText,resText)}</td>
      <td>${buildStatusCell(d)}</td>
      <td class="editable-cell" id="cell-${d.id}-res" onclick="startEdit(${d.id},'res',this,'area')"><span class="${resCls}">${esc(resText)}</span>${dRes}<span class="edit-hint">✎</span></td>
      <td class="editable-cell" id="cell-${d.id}-prox" onclick="startEdit(${d.id},'prox',this,'area')"><span class="prox-text">${esc(proxText)}</span>${dProx}<span class="edit-hint">✎</span></td>
      <td class="editable-cell" id="cell-${d.id}-ver" onclick="startEdit(${d.id},'ver',this,'inline')"><span class="ver-text">${esc(verText)}</span>${dVer}<span class="edit-hint">✎</span></td>
    </tr>`;
  }).join('');
}

// ================================================================
// STATUS PICKER
// ================================================================
let openPickerId = null;

function toggleStPicker(e, id) {
  e.stopPropagation();
  const picker=document.getElementById('stp-'+id);
  if (!picker) return;
  const isOpen=picker.classList.contains('open');
  closeAllStPickers();
  if (!isOpen) { picker.classList.add('open'); openPickerId=id; }
}
function closeAllStPickers() {
  document.querySelectorAll('.st-picker.open').forEach(p=>p.classList.remove('open'));
  openPickerId=null;
}
function applyMultiSt(e, id, val) {
  e.stopPropagation();
  toggleStStatus(id, val);
  renderStats(); renderFilters(); renderTable();
  setTimeout(()=>{ const p=document.getElementById('stp-'+id); if(p){p.classList.add('open');openPickerId=id;} },0);
}
function restoreStatus(id) {
  delStOv(id); closeAllStPickers(); renderStats(); renderFilters(); renderTable();
}
document.addEventListener('click', e => { if(openPickerId&&!e.target.closest('.st-wrap')) closeAllStPickers(); });

// ================================================================
// EDIÇÃO DE CAMPOS — TODAS AS COLUNAS
// ================================================================
function startEdit(id, field, cell, mode) {
  if (cell.querySelector('textarea,input.edit-box-inline')) return;
  const d=data.find(x=>x.id===id); if (!d) return;
  const current=getOv(id,field)!==null?getOv(id,field):(d[field]??'');
  const snapshot=cell.innerHTML;
  cell.onclick=null;
  const actions=`<div class="edit-actions"><button class="edit-save" onclick="doSave(event,${id},'${field}')">💾 Salvar</button><button class="edit-cancel" onclick="doCancel(event,${id},'${field}',this)">Cancelar</button><button class="edit-clear" onclick="doClear(event,${id},'${field}')">↩ Original</button></div>`;
  if (mode==='inline') {
    cell.innerHTML=`<input type="text" class="edit-box-inline" id="eb-${id}-${field}" value="${escAttr(current)}" />${actions}`;
  } else {
    cell.innerHTML=`<textarea class="edit-box" id="eb-${id}-${field}">${escAttr(current)}</textarea>${actions}`;
  }
  cell.querySelector('.edit-cancel')._snap=snapshot;
  const inp=cell.querySelector('textarea,input');
  if (inp) { inp.focus(); if (inp.select) inp.select(); }
}

function doSave(e,id,field) {
  e.stopPropagation();
  const el=document.getElementById('eb-'+id+'-'+field);
  if (el) setOv(id,field,el.value);
  renderTable();
}
function doCancel(e,id,field,btn) {
  e.stopPropagation();
  const cell=document.getElementById('cell-'+id+'-'+field); if (!cell) return;
  cell.innerHTML=btn._snap;
  const mode=(field==='res'||field==='prox')?'area':'inline';
  cell.onclick=function(){startEdit(id,field,cell,mode);};
}
function doClear(e,id,field) { e.stopPropagation(); delOv(id,field); renderTable(); }

// ================================================================
// EXPORTAR CSV
// ================================================================
function exportCSV() {
  const rows=[['Cliente','Processo','Tipo','Status','Estado atual','Próximo passo','Verificação']];
  filtered().forEach(d=>{
    rows.push([getField(d,'cl'),getField(d,'proc'),d.tipo,
      effStArr(d).map(s=>ST_LABELS[s]||s).join(' + '),
      getField(d,'res'),getField(d,'prox'),getField(d,'ver')]);
  });
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent('﻿'+csv);
  a.download='processos_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

// ================================================================
// INIT
// ================================================================
function renderAll() { renderStats(); renderFilters(); renderTable(); }
window.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('search').addEventListener('input', e=>{ searchTerm=e.target.value; renderTable(); });
  initSync();
});
