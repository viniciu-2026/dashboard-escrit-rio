name: Atualizacao processual

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  atualizar-processos:
    name: Atualizar processos
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TZ: America/Sao_Paulo
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GOVBR_CPF: ${{ secrets.GOVBR_CPF }}
      GOVBR_PASSWORD: ${{ secrets.GOVBR_PASSWORD }}
      TRIBUNAL_CPF: ${{ secrets.TRIBUNAL_CPF }}
      TRIBUNAL_PASSWORD: ${{ secrets.TRIBUNAL_PASSWORD }}
      PJE_CPF: ${{ secrets.PJE_CPF }}
      PJE_PASSWORD: ${{ secrets.PJE_PASSWORD }}
      EPROC_CPF: ${{ secrets.EPROC_CPF }}
      EPROC_PASSWORD: ${{ secrets.EPROC_PASSWORD }}
      JF_CPF: ${{ secrets.JF_CPF }}
      JF_PASSWORD: ${{ secrets.JF_PASSWORD }}
      FIREBASE_DATABASE_AUTH_TOKEN: ${{ secrets.FIREBASE_DATABASE_AUTH_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_OAUTH_JSON: ${{ secrets.GMAIL_OAUTH_JSON }}
      JUSBR_URL: https://www.jus.br/servicos/
      BROWSER_HEADLESS: "false"

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar Secrets obrigatorios
        shell: pwsh
        run: |
          $missing = @()
          foreach ($name in @("GOVBR_CPF", "GOVBR_PASSWORD")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += $name
            }
          }
          if ([string]::IsNullOrWhiteSpace($env:GMAIL_OAUTH_JSON) -and ([string]::IsNullOrWhiteSpace($env:GMAIL_REFRESH_TOKEN) -or [string]::IsNullOrWhiteSpace($env:GMAIL_CLIENT_ID) -or [string]::IsNullOrWhiteSpace($env:GMAIL_CLIENT_SECRET))) {
            $missing += "GMAIL_OAUTH_JSON ou GMAIL_REFRESH_TOKEN/GMAIL_CLIENT_ID/GMAIL_CLIENT_SECRET"
          }
          if ([string]::IsNullOrWhiteSpace($env:FIREBASE_DATABASE_AUTH_TOKEN) -and [string]::IsNullOrWhiteSpace($env:FIREBASE_SERVICE_ACCOUNT_JSON)) {
            $missing += "FIREBASE_DATABASE_AUTH_TOKEN ou FIREBASE_SERVICE_ACCOUNT_JSON"
          }
          if ($missing.Count -gt 0) {
            throw "Secrets obrigatorios ausentes: $($missing -join ', ')"
          }

      - name: Instalar Playwright
        timeout-minutes: 10
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          for attempt in 1 2 3; do
            npm install --no-save playwright && break
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep 20
          done
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && break
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep 20
          done

      - name: Rodar atualizacao processual
        shell: bash
        timeout-minutes: 30
        run: |
          mkdir -p automation-report
          echo "Executando preflight..."
          timeout 180s pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/run-process-update.ps1 | tee automation-report/preflight.json
          echo "Executando runner Node/Playwright..."
          timeout 900s xvfb-run -a node ./tools/github-process-update.mjs --report-dir automation-report | tee automation-report/github-process-update.log

      - name: Publicar relatorio de automacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atualizacao-processual-report
          path: automation-report/
          if-no-files-found: warn
          retention-days: 14
