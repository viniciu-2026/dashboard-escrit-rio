name: Atualizacao processual

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  atualizar-processos:
    name: Atualizar processos
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TZ: America/Sao_Paulo
      GOVBR_CPF: ${{ secrets.GOVBR_CPF }}
      GOVBR_PASSWORD: ${{ secrets.GOVBR_PASSWORD }}
      FIREBASE_DATABASE_AUTH_TOKEN: ${{ secrets.FIREBASE_DATABASE_AUTH_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      JUSBR_URL: https://jus.br

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Playwright
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          for attempt in 1 2 3; do
            npm install --no-save playwright && break
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep 20
          done
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && break
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep 20
          done

      - name: Rodar atualizacao processual
        shell: pwsh
        run: ./tools/run-process-update-github.ps1

      - name: Publicar relatorio de automacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atualizacao-processual-report
          path: automation-report/
          if-no-files-found: warn
          retention-days: 14
